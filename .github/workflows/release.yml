name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: npm verifies this job's OIDC token against the package's configured
  # publisher, so there is no NPM_TOKEN to leak, and its absence below is deliberate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
